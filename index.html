const VIRTUAL_TEAM_IDS=new Set(['kc-rebels-nationals','kc-rebels-all-regional']);
function cleanName(value){
 const name=String(value||'').trim().replace(/\s+/g,' ');
 if(name.length<2||name.length>100)throw Error('Enter a player name (2–100 characters).');
 return name;
}
function cleanTeamIds(ids){
 return [...new Set((Array.isArray(ids)?ids:[]).filter(id=>typeof id==='string'&&id&&!VIRTUAL_TEAM_IDS.has(id)))];
}
function canonicalPlayer(id,data={}){
 return {id,name:String(data.name||'').trim(),teamIds:cleanTeamIds(data.teamIds),pitcher:data.pitcher===true,catcher:data.catcher===true,active:data.active!==false,playerPortalEnabled:data.playerPortalEnabled===true,jerseyNumber:String(data.jerseyNumber||'').trim(),email:String(data.email||'').trim()};
}
function rosterForTeam(players,teamId){
 return players.map(p=>canonicalPlayer(p.id,p)).filter(p=>p.active&&p.teamIds.includes(teamId)).sort((a,b)=>a.name.localeCompare(b.name));
}
function planAddPlayer({name,teamId,pitcher=false,catcher=false,email='',jerseyNumber=''},existing=[]){
 const label=cleanName(name);
 if(!teamId||VIRTUAL_TEAM_IDS.has(teamId))throw Error('Select an individual Rebels team.');
 if(existing.some(p=>p.name?.trim().toLocaleLowerCase()===label.toLocaleLowerCase()&&cleanTeamIds(p.teamIds).includes(teamId)))throw Error('That player is already on this team.');
 const address=String(email||'').trim().toLowerCase();
 if(address&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address))throw Error('Enter a valid email or leave it blank.');

 const teamIds=cleanTeamIds(player.teamIds);
 if(!teamIds.includes(teamId))throw Error('Player is not on that team.');

 return {...player,teamIds:remaining,active:remaining.length>0,playerPortalEnabled:remaining.length>0&&player.playerPortalEnabled===true};

 if(!toTeamId||VIRTUAL_TEAM_IDS.has(toTeamId)||fromTeamId===toTeamId)throw Error('Choose a different individual Rebels team.');
 if(!cleanTeamIds(player.teamIds).includes(fromTeamId))throw Error('Player is not on the source team.');

let ctx=null,teamId='',players=[],busy=false,error='',message='',editId='',mode='list';
function shell(body){
 app.innerHTML='<div class="rm-shell"><span class="rm-back">RebelsPrep · Local Preview</span><h1>Roster</h1><p class="rm-subtitle">Try add, edit, remove and transfer with fake players. Refresh this page to reset.</p>'+ (error?'<p class="rm-error" role="alert">'+esc(error)+'</p>':'')+(message?'<p class="rm-success" role="status">'+esc(message)+'</p>':'')+body+'</div><nav class="coach-bottom-nav" aria-label="Coach navigation"><button data-coach-view="home">Home</button><button data-coach-view="practice">Practice</button><button data-coach-view="focus">Focus</button><button data-coach-view="more">More</button><button data-coach-view="roster" aria-current="page">Roster</button></nav>';
 app.querySelectorAll('.coach-bottom-nav [data-coach-view]').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.coachView;if(target==='roster')return;location.assign('./coach.html?v=420&view='+(target==='more'?'library':target));}));
}
function permittedTeams(){return individual.filter(t=>canManageTeam(ctx?.account,t.id));}
function page(){
 const choices=permittedTeams();if(!choices.length){shell('<p>You do not have a team assigned. Ask your RebelsPrep administrator.</p>');return;}
 const pick='<label class="rm-label">Team<select id="rm-team" aria-label="Team">'+choices.map(t=>'<option value="'+esc(t.id)+'" '+(t.id===teamId?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label>';
 if(mode==='transfer'){
  const player=players.find(p=>p.id===editId);
  shell(pick+'<form id="rm-transfer-form" class="rm-form"><h2>Transfer '+esc(player?.name||'Player')+'</h2><label class="rm-label">Destination team<select id="rm-destination" aria-label="Destination team">'+choices.filter(t=>t.id!==teamId).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select></label><p>The player keeps her identity and history.</p><div class="rm-actions"><button type="button" id="rm-cancel">Cancel</button><button type="submit" class="rm-primary">Confirm Transfer</button></div></form>');
 }else if(mode==='form'){
  const p=players.find(p=>p.id===editId)||{};
  shell(pick+'<form id="rm-form" class="rm-form"><h2>'+(editId?'Edit Player':'Add Player')+'</h2><label class="rm-label">Player name<input required maxlength="100" name="name" value="'+esc(p.name||'')+'"></label><label class="rm-label">Email (optional)<input type="email" maxlength="254" name="email" value="'+esc(p.email||'')+'"></label><label class="rm-label">Jersey number (optional)<input maxlength="12" name="jerseyNumber" value="'+esc(p.jerseyNumber||'')+'"></label><div class="rm-checks"><label><input type="checkbox" name="pitcher" '+(p.pitcher?'checked':'')+'> Pitcher</label><label><input type="checkbox" name="catcher" '+(p.catcher?'checked':'')+'> Catcher</label></div><div class="rm-actions"><button type="button" id="rm-cancel">Cancel</button><button class="rm-primary" type="submit" '+(busy?'disabled':'')+'>Save Player</button></div></form>');
 }else{
  shell(pick+'<div class="rm-actions"><strong>'+players.length+' active players</strong><button class="rm-primary" id="rm-add">+ Add Player</button></div><div class="rm-players">'+players.map(p=>'<article class="rm-player"><div><strong>'+esc(p.name)+'</strong><small>'+(p.pitcher?'Pitcher ':'')+(p.catcher?'Catcher ':'')+(p.jerseyNumber?'#'+esc(p.jerseyNumber):'')+'</small></div><div class="rm-actions"><button data-edit="'+esc(p.id)+'">Edit</button><button data-remove="'+esc(p.id)+'">Remove</button>'+(isOrgCoach(ctx.account)?'<button data-transfer="'+esc(p.id)+'">Transfer</button>':'')+'</div></article>').join('')+'</div>');
 }
 document.querySelectorAll('.rm-shell button, .rm-shell input, .rm-shell select').forEach(el=>el.disabled=busy);
 const selector=document.getElementById('rm-team');
 selector?.addEventListener('change',e=>{teamId=e.target.value;editId='';mode='list';reload();});
 document.getElementById('rm-add')?.addEventListener('click',()=>{editId='';mode='form';error='';page();});
 document.getElementById('rm-cancel')?.addEventListener('click',()=>{editId='';mode='list';error='';page();});
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{editId=b.dataset.edit;mode='form';error='';page();}));
 document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>remove(b.dataset.remove)));
 document.querySelectorAll('[data-transfer]').forEach(b=>b.addEventListener('click',()=>{editId=b.dataset.transfer;mode='transfer';error='';page();}));
 document.getElementById('rm-transfer-form')?.addEventListener('submit',e=>{e.preventDefault();transfer(editId,document.getElementById('rm-destination').value);});
 document.getElementById('rm-form')?.addEventListener('submit',e=>{e.preventDefault();save(new FormData(e.currentTarget));});
}
let loadVersion=0;
async function reload(){
 const version=++loadVersion, selected=teamId;players=[];page();
 try{error='';const rows=await loadTeamRoster(ctx.account,selected);if(version!==loadVersion)return;players=rows;page();}catch(e){if(version!==loadVersion)return;error=e.message||String(e);page();}
}
async function save(form){
 if(busy)return;busy=true;error='';message='';page();
 const values={name:form.get('name'),email:form.get('email'),jerseyNumber:form.get('jerseyNumber'),pitcher:form.has('pitcher'),catcher:form.has('catcher')};
 try{if(editId)await editRosterPlayer(ctx.account,teamId,editId,values);else await addRosterPlayer(ctx.account,teamId,values);message=editId?'Player updated.':'Player added.';editId='';mode='list';await reload();}
 catch(e){error=e.message||String(e);page();}
 finally{busy=false;page();}
}
async function remove(id){
 if(busy)return;const player=players.find(p=>p.id===id);if(!player)return;
 if(!confirm('Remove '+player.name+' from this team? This does not affect HotB.'))return;
 busy=true;error='';message='';page();
 try{await removeRosterPlayer(ctx.account,teamId,id);message=player.name+' removed from this team.';await reload();}
 catch(e){error=e.message||String(e);page();}
 finally{busy=false;page();}
}
async function transfer(id,selected){
 if(busy||!isOrgCoach(ctx.account))return;
 const player=players.find(p=>p.id===id);if(!player)return;
 const choices=permittedTeams().filter(t=>t.id!==teamId);
 const target=choices.find(t=>t.id===selected.trim());
 if(!target){error='Choose a destination team.';page();return;}
 if(!confirm('Transfer '+player.name+' to '+target.name+'? Her player identity and history will be preserved.'))return;
 busy=true;error='';message='';page();
 try{await transferRosterPlayer(ctx.account,teamId,target.id,id);message='Player transferred.';mode='list';editId='';await reload();}
 catch(e){error=e.message||String(e);}
 finally{busy=false;page();}
}
try{
 ctx=await accountContext();
 if(!ctx?.user||!isCoach(ctx.account)){shell('<p>Sign in as an assigned coach to manage a team roster.</p><a href="./coach.html?v=420">Coach Sign In</a>');}
 else{teamId=permittedTeams()[0]?.id||'';await reload();}
}catch(e){error=e.message||String(e);shell('<a href="./coach.html?v=420">Return to Coach Sign In</a>');}
function card(label,title,copy,target,extra=''){return '<button class="coach-card" data-coach-view="'+target+'"><div class="eyebrow">'+esc(label)+'</div><h2>'+esc(title)+extra+'</h2><p>'+esc(copy)+'</p></button>';}
function coachHome(){return '<div class="coach-portal-home"><section class="coach-greeting"><div class="eyebrow">COACH PORTAL</div><h1>Hi, '+esc(firstName())+'</h1><p>Your practice assignments, player focus and Rebels drill tools are all in one place.</p></section><div class="coach-card-stack">'+
 card('PRACTICE','My Practice','See your active practice, current station, players and drill instructions.','practice')+
 card('PLAYER DEVELOPMENT','Player Focus','Open your team roster, review focus status and add player observations.','focus')+
 card('LIBRARY','Drill Library','Browse the RebelsPrep drill library and open full drill instructions.','library')+
 card('TEAM','Roster','View and manage the players on your team.','roster')+
 '</div>'+accountActions()+'</div>';}
function previewNav(){return '<nav class="coach-bottom-nav"><button data-coach-view="home" aria-current="page">Home</button><button data-coach-view="practice">Practice</button><button data-coach-view="focus">Focus</button><button data-coach-view="more">More</button><button data-coach-view="roster">Roster</button></nav>';}
function firstName(){return 'Coach';}function accountActions(){return '';}
function dashboard(){app.innerHTML=coachHome()+previewNav();}
document.addEventListener('click',event=>{const button=event.target.closest('[data-coach-view]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();const destination=button.dataset.coachView;if(destination==='home'){dashboard();}else if(destination==='roster'){mode='list';editId='';error='';message='';reload();}else{alert('This local preview covers the dashboard and Roster. Other screens are unchanged.');}},true);
dashboard();

(()=>{/* Coach bottom nav: Home, Practice, Focus, Drills, Roster. Keep the native More control only as a hidden routing driver for Drill Library. */
const app=document.getElementById('app');
const icons={
 roster:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M17 13a5 5 0 0 1 4 5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
 home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9.5h-6v-6h-5v6h-6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>',
 practice:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5.8 7.6c2.1 1 3.8 2.7 4.8 4.8m7.6-4.8c-2.1 1-3.8 2.7-4.8 4.8m-7.6 4c2.1-1 3.8-2.7 4.8-4.8m7.6 4c-2.1-1-3.8-2.7-4.8-4.8" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>',
 focus:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
 drills:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 8h7.6M8.2 12h7.6M8.2 16h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
};
function label(button,key,text){button.classList.add('coach-nav-item');button.innerHTML='<span class="coach-nav-icon">'+icons[key]+'</span><span class="coach-nav-label">'+text+'</span>';}
function patchNav(){
 const nav=app?.querySelector('.coach-bottom-nav');
 if(!nav)return;
 nav.classList.add('coach-bottom-nav-hotb');
 const home=[...nav.querySelectorAll('button')].find(b=>b.dataset.coachView==='home');
 const practice=[...nav.querySelectorAll('button')].find(b=>b.dataset.coachView==='practice');
 const focus=[...nav.querySelectorAll('button')].find(b=>b.dataset.coachView==='focus');
 const roster=nav.querySelector('[data-coach-view="roster"]');
 if(roster&&!roster.querySelector('.coach-nav-icon'))label(roster,'roster','Roster');
 const more=[...nav.querySelectorAll('button')].find(b=>b.dataset.coachView==='more');
 if(home&&!home.querySelector('.coach-nav-icon'))label(home,'home','Home');
 if(practice&&!practice.querySelector('.coach-nav-icon'))label(practice,'practice','Practice');
 if(focus&&!focus.querySelector('.coach-nav-icon'))label(focus,'focus','Focus');
 let drills=nav.querySelector('[data-rp-drills="1"]');
 if(!drills&&more){
  drills=document.createElement('button');drills.type='button';drills.dataset.rpDrills='1';
  label(drills,'drills','Drills');
  drills.addEventListener('click',()=>{
   const driver=[...nav.querySelectorAll('button')].find(b=>b.dataset.coachView==='more');
   if(!driver)return;
   const old=driver.dataset.coachView;driver.dataset.coachView='library';driver.click();driver.dataset.coachView=old;
  });
  nav.insertBefore(drills,more);
 }else if(drills&&!drills.querySelector('.coach-nav-icon'))label(drills,'drills','Drills');
 if(more){more.hidden=true;more.style.display='none';more.setAttribute('aria-hidden','true');more.tabIndex=-1;}
 nav.querySelectorAll('.coach-nav-item:not([hidden])').forEach(b=>{b.style.flex='1 1 20%';});
 const title=app?.querySelector('.coach-page-head h1')?.textContent?.trim()||'';
 if(title==='Drill Library'){
  nav.querySelectorAll('[aria-current="page"]').forEach(b=>b.removeAttribute('aria-current'));
  drills?.setAttribute('aria-current','page');
 }
}
if(app){const observer=new MutationObserver(()=>queueMicrotask(patchNav));observer.observe(app,{childList:true,subtree:true});patchNav();}
})();</script></html>
