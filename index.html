<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>RebelsPrep · Roster Test</title><style>*{box-sizing:border-box}body{margin:0;color:#202936;background:#f6f7f8;font:16px/1.5 system-ui,sans-serif}header{max-width:744px;margin:auto;padding:22px 12px 6px}header img{width:230px;max-width:70%;height:auto}.test-bar{max-width:720px;margin:12px auto 18px;padding:16px;background:#fff4d9;border:1px solid #e1c783;border-radius:12px;font-size:14px}.test-bar strong{display:block}.test-bar p{margin:6px 0 12px}.test-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.test-row label{flex:1;font-weight:700}.test-row select{display:block;width:100%;font:inherit;padding:10px;background:white;border:1px solid #a59a82;border-radius:6px}.test-row button{font:inherit;padding:11px;border:1px solid #a59a82;border-radius:6px;background:white;cursor:pointer}.coach-bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,744px);display:flex;justify-content:space-around;background:white;padding:12px 4px max(12px,env(safe-area-inset-bottom));border-top:1px solid #ddd;z-index:10}.coach-bottom-nav button{border:0;background:none;padding:8px;font:700 13px system-ui;cursor:pointer}.coach-bottom-nav [aria-current]{color:#c8102e}button{cursor:pointer}button:disabled{opacity:.5}@media(max-width:760px){.test-bar{margin:12px}.rm-shell{padding-bottom:110px}}.rm-shell{max-width:720px;margin:0 auto;padding:8px 12px 100px}.rm-shell h1{font-size:36px;margin:10px 0}.rm-back{font-size:16px;font-weight:800;color:#232b37;text-decoration:none}.rm-subtitle{font-size:16px;color:#697386;margin:0 0 20px}.rm-error,.rm-success{padding:12px;border-radius:10px;background:#f8ecec;color:#86151f}.rm-success{background:#edf5ec;color:#24512e}.rm-label{display:block;font-size:15px;font-weight:800;margin:16px 0}.rm-label input,.rm-label select{display:block;box-sizing:border-box;width:100%;padding:13px;border:2px solid #d8ddd9;border-radius:12px;margin:6px 0;font-size:16px;background:white}.rm-actions{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rm-actions button{padding:12px 14px;background:white;color:#111827;border:2px solid #d8ddd9;border-radius:12px;font-size:15px;font-weight:800}.rm-actions .rm-primary,.rm-primary{background:#c8102e;color:white;border:2px solid #c8102e;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:800}.rm-players{display:grid;gap:12px;margin-top:18px}.rm-player{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border:2px solid #d8ddd9;border-radius:18px;background:white}.rm-player strong{font-size:18px}.rm-player small{display:block;color:#667085;margin-top:6px}.rm-form{padding:20px;border:2px solid #d8ddd9;border-radius:20px;background:white}.rm-form h2{margin:0}.rm-checks{display:flex;gap:22px;margin:14px 0 22px;font-weight:800}.rm-checks input{width:18px;height:18px}.rm-form .rm-actions{justify-content:flex-end}@media(max-width:520px){.rm-player{align-items:flex-start;flex-direction:column}.rm-player .rm-actions{width:100%;justify-content:flex-end}}
</style></head><body><header><img src="rebelsprep-logo-v2.png" alt="RebelsPrep"></header><aside class="test-bar"><strong>TEST VERSION — FAKE PLAYERS ONLY</strong><p>Try your roster controls below. No login is needed. Access is simulated; this does not check real coach accounts or database permissions. Changes stay in this open tab and reset when you refresh. Use fake names only.</p><div class="test-row"><label>Test access<select id="test-access"><option value="admin">You — Administrator (all rosters)</option><option value="coachA">Team coach — 16 Regional Lickel only</option><option value="coachB">Team coach — 14 National Shafer only</option></select></label><button id="reset-test">Reset fake players</button></div></aside><main id="app"></main><script type="module">// Permanent roster operations. These helpers do not modify HotB records.
const VIRTUAL_TEAM_IDS=new Set(['kc-rebels-nationals','kc-rebels-all-regional']);
function cleanName(value){
 const name=String(value||'').trim().replace(/\s+/g,' ');
 if(name.length<2||name.length>100)throw Error('Enter a player name (2–100 characters).');
 return name;
}
function cleanTeamIds(ids){
 return [...new Set((Array.isArray(ids)?ids:[]).filter(id=>typeof id==='string'&&id&&!VIRTUAL_TEAM_IDS.has(id)))];
}
function canonicalPlayer(id,data={}){
 return {id,name:String(data.name||'').trim(),teamIds:cleanTeamIds(data.teamIds),pitcher:data.pitcher===true,catcher:data.catcher===true,active:data.active!==false,playerPortalEnabled:data.playerPortalEnabled===true,jerseyNumber:String(data.jerseyNumber||'').trim(),email:String(data.email||'').trim()};
}
function rosterForTeam(players,teamId){
 return players.map(p=>canonicalPlayer(p.id,p)).filter(p=>p.active&&p.teamIds.includes(teamId)).sort((a,b)=>a.name.localeCompare(b.name));
}
function planAddPlayer({name,teamId,pitcher=false,catcher=false,email='',jerseyNumber=''},existing=[]){
 const label=cleanName(name);
 if(!teamId||VIRTUAL_TEAM_IDS.has(teamId))throw Error('Select an individual Rebels team.');
 if(existing.some(p=>p.name?.trim().toLocaleLowerCase()===label.toLocaleLowerCase()&&cleanTeamIds(p.teamIds).includes(teamId)))throw Error('That player is already on this team.');
 const address=String(email||'').trim().toLowerCase();
 if(address&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address))throw Error('Enter a valid email or leave it blank.');
 const number=String(jerseyNumber||'').trim();
 if(number.length>12)throw Error('Jersey number is too long.');
 return {name:label,teamIds:[teamId],pitcher:!!pitcher,catcher:!!catcher,email:address,jerseyNumber:number,active:true};
}
function planRemovePlayer(player,teamId){
 const teamIds=cleanTeamIds(player.teamIds);
 if(!teamIds.includes(teamId))throw Error('Player is not on that team.');
 const remaining=teamIds.filter(id=>id!==teamId);
 return {...player,teamIds:remaining,active:remaining.length>0,playerPortalEnabled:remaining.length>0&&player.playerPortalEnabled===true};
}
function planTransferPlayer(player,fromTeamId,toTeamId){
 if(!toTeamId||VIRTUAL_TEAM_IDS.has(toTeamId)||fromTeamId===toTeamId)throw Error('Choose a different individual Rebels team.');
 if(!cleanTeamIds(player.teamIds).includes(fromTeamId))throw Error('Player is not on the source team.');
 return {...player,teamIds:[...new Set([...cleanTeamIds(player.teamIds).filter(id=>id!==fromTeamId),toTeamId])],active:true};
}
function canManageTeam(account,teamId){
 return Boolean(account?.active&&(account.role==='org_admin'||account.role==='org_coach'||account.role==='team_coach'&&account.teamIds?.includes(teamId)));
}

const teams=[{"id": "kc-rebels-18-national", "name": "KC Rebels 18 National Mayhugh"}, {"id": "kc-rebels-18-regional", "name": "KC Rebels 18 Regional Jenkins"}, {"id": "kc-rebels-16-national", "name": "KC Rebels 16 National Olsen"}, {"id": "kc-rebels-16-regional", "name": "KC Rebels 16 Regional Lickel"}, {"id": "kc-rebels-16-frans", "name": "KC Rebels 16 Frans"}, {"id": "kc-rebels-14-national", "name": "KC Rebels 14 National Shafer"}, {"id": "kc-rebels-14-regional", "name": "KC Rebels 14 Regional Oestmann"}, {"id": "kc-rebels-14-mason-shafer", "name": "KC Rebels 14 Mason/Shafer"}, {"id": "kc-rebels-14-ufford", "name": "KC Rebels 14 Ufford"}, {"id": "kc-rebels-14b", "name": "KC Rebels 14B"}, {"id": "kc-rebels-12-bachkora", "name": "KC Rebels 12 Bachkora"}, {"id": "kc-rebels-12-eakin", "name": "KC Rebels 12 Eakin"}, {"id": "kc-rebels-12-huebert", "name": "KC Rebels 12 Huebert"}, {"id": "kc-rebels-12-perkins", "name": "KC Rebels 12 Perkins"}, {"id": "kc-rebels-12-stremsterfer", "name": "KC Rebels 12 Stremsterfer"}, {"id": "kc-rebels-11-coppage", "name": "KC Rebels 11 Coppage"}, {"id": "kc-rebels-10-bachkora", "name": "KC Rebels 10 Bachkora"}, {"id": "kc-rebels-10-carroll", "name": "KC Rebels 10 Carroll"}, {"id": "kc-rebels-10-graves", "name": "KC Rebels 10 Graves"}, {"id": "kc-rebels-10-perkins", "name": "KC Rebels 10 Perkins"}, {"id": "kc-rebels-9-sherman", "name": "KC Rebels 9 Sherman"}, {"id": "kc-rebels-8-cairns", "name": "KC Rebels 8 Cairns"}];

const source='kc-rebels-16-regional',target='kc-rebels-14-national';
const testAccounts={admin:{active:true,role:'org_admin',teamIds:[]},coachA:{active:true,role:'team_coach',teamIds:[source]},coachB:{active:true,role:'team_coach',teamIds:[target]}};
let testRole='admin',records=[{id:'synthetic-001',name:'TEST Player One',teamIds:[source],pitcher:true,active:true,jerseyNumber:'10'},{id:'synthetic-002',name:'TEST Player Two',teamIds:[source],catcher:true,active:true,jerseyNumber:'20'},{id:'synthetic-003',name:'TEST Player Three',teamIds:[target],active:true,jerseyNumber:'30'}];
const accountContext=async()=>({user:{uid:'synthetic-'+testRole},account:testAccounts[testRole]});
const isOrgCoach=a=>!!a?.active&&['org_admin','org_coach'].includes(a.role);
const isCoach=a=>!!a?.active&&['org_admin','org_coach','team_coach'].includes(a.role);
function requireTeam(a,t){if(!canManageTeam(a,t))throw Error('You can manage only your assigned team.');}
function findPlayer(a,t,id){requireTeam(a,t);const p=records.find(p=>p.id===id&&p.active&&p.teamIds.includes(t));if(!p)throw Error('Player is no longer on this team.');return p;}
async function loadTeamRoster(a,t){requireTeam(a,t);return rosterForTeam(records,t);}
async function addRosterPlayer(a,t,v){requireTeam(a,t);const next=planAddPlayer({...v,teamId:t},records);records.push({...next,id:crypto.randomUUID()});}
async function editRosterPlayer(a,t,id,v){const p=findPlayer(a,t,id);const next=planAddPlayer({...v,teamId:t},records.filter(r=>r.id!==id));Object.assign(p,{name:next.name,email:next.email,jerseyNumber:next.jerseyNumber,pitcher:next.pitcher,catcher:next.catcher});}
async function removeRosterPlayer(a,t,id){const p=findPlayer(a,t,id);Object.assign(p,planRemovePlayer(p,t));}
async function transferRosterPlayer(a,f,t,id){if(!isOrgCoach(a))throw Error('Only the administrator can transfer players.');requireTeam(a,t);const p=findPlayer(a,f,id);Object.assign(p,planTransferPlayer(p,f,t));}

const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const individual=teams.filter(t=>!['kc-rebels-nationals','kc-rebels-all-regional'].includes(t.id));
let ctx=null,teamId='',players=[],busy=false,error='',message='',editId='',mode='list',draft=null;
function shell(body){
 app.innerHTML='<div class="rm-shell"><span class="rm-back">RebelsPrep · Test Roster</span><h1>Roster</h1><p class="rm-subtitle">'+(isOrgCoach(ctx?.account)?'Add, remove or transfer players across all team rosters.':'Add or remove players from your assigned team roster.')+'</p>'+ (error?'<p class="rm-error" role="alert">'+esc(error)+'</p>':'')+(message?'<p class="rm-success" role="status">'+esc(message)+'</p>':'')+body+'</div><nav class="coach-bottom-nav" aria-label="Coach navigation"><button data-coach-view="home">Home</button><button data-coach-view="practice">Practice</button><button data-coach-view="focus">Focus</button><button data-coach-view="more">More</button><button data-coach-view="roster" aria-current="page">Roster</button></nav>';
 app.querySelectorAll('.coach-bottom-nav [data-coach-view]').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.coachView;if(target==='roster')return;alert('This separate test version covers Roster. The other coach screens remain unchanged in the live app.');}));
}
function permittedTeams(){return individual.filter(t=>canManageTeam(ctx?.account,t.id));}
function page(){
 const choices=permittedTeams();if(!choices.length){shell('<p>You do not have a team assigned. Ask your RebelsPrep administrator.</p>');return;}
 const pick='<label class="rm-label">Team<select id="rm-team" aria-label="Team">'+choices.map(t=>'<option value="'+esc(t.id)+'" '+(t.id===teamId?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label>';
 if(mode==='transfer'){
  const player=players.find(p=>p.id===editId);
  shell(pick+'<form id="rm-transfer-form" class="rm-form"><h2>Transfer '+esc(player?.name||'Player')+'</h2><label class="rm-label">Destination team<select id="rm-destination" aria-label="Destination team">'+choices.filter(t=>t.id!==teamId).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select></label><p>The player keeps her identity and history.</p><div class="rm-actions"><button type="button" id="rm-cancel">Cancel</button><button type="submit" class="rm-primary">Confirm Transfer</button></div></form>');
 }else if(mode==='form'){
  const p=draft||players.find(p=>p.id===editId)||{};
  shell(pick+'<form id="rm-form" class="rm-form"><h2>'+(editId?'Edit Player':'Add Player')+'</h2><label class="rm-label">Player name<input required maxlength="100" name="name" value="'+esc(p.name||'')+'"></label><label class="rm-label">Email (optional)<input type="email" maxlength="254" name="email" value="'+esc(p.email||'')+'"></label><label class="rm-label">Jersey number (optional)<input maxlength="12" name="jerseyNumber" value="'+esc(p.jerseyNumber||'')+'"></label><div class="rm-checks"><label><input type="checkbox" name="pitcher" '+(p.pitcher?'checked':'')+'> Pitcher</label><label><input type="checkbox" name="catcher" '+(p.catcher?'checked':'')+'> Catcher</label></div><div class="rm-actions"><button type="button" id="rm-cancel">Cancel</button><button class="rm-primary" type="submit" '+(busy?'disabled':'')+'>Save Player</button></div></form>');
 }else{
  shell(pick+'<div class="rm-actions"><strong>'+players.length+' active players</strong><button class="rm-primary" id="rm-add">+ Add Player</button></div><div class="rm-players">'+players.map(p=>'<article class="rm-player"><div><strong>'+esc(p.name)+'</strong><small>'+(p.pitcher?'Pitcher ':'')+(p.catcher?'Catcher ':'')+(p.jerseyNumber?'#'+esc(p.jerseyNumber):'')+'</small></div><div class="rm-actions"><button data-edit="'+esc(p.id)+'">Edit</button><button data-remove="'+esc(p.id)+'">Remove</button>'+(isOrgCoach(ctx.account)?'<button data-transfer="'+esc(p.id)+'">Transfer</button>':'')+'</div></article>').join('')+'</div>');
 }
 document.querySelectorAll('.rm-shell button, .rm-shell input, .rm-shell select').forEach(el=>el.disabled=busy);
 const selector=document.getElementById('rm-team');
 selector?.addEventListener('change',e=>{teamId=e.target.value;editId='';mode='list';reload();});
 document.getElementById('rm-add')?.addEventListener('click',()=>{editId='';draft=null;mode='form';error='';page();});
 document.getElementById('rm-cancel')?.addEventListener('click',()=>{editId='';draft=null;mode='list';error='';page();});
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{editId=b.dataset.edit;draft=null;mode='form';error='';page();}));
 document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>remove(b.dataset.remove)));
 document.querySelectorAll('[data-transfer]').forEach(b=>b.addEventListener('click',()=>{editId=b.dataset.transfer;mode='transfer';error='';page();}));
 document.getElementById('rm-transfer-form')?.addEventListener('submit',e=>{e.preventDefault();transfer(editId,document.getElementById('rm-destination').value);});
 document.getElementById('rm-form')?.addEventListener('submit',e=>{e.preventDefault();save(new FormData(e.currentTarget));});
}
let loadVersion=0;
async function reload(){
 const version=++loadVersion, selected=teamId;players=[];page();
 try{error='';const rows=await loadTeamRoster(ctx.account,selected);if(version!==loadVersion)return;players=rows;page();}catch(e){if(version!==loadVersion)return;error=e.message||String(e);page();}
}
async function save(form){
 if(busy)return;
 const values={name:form.get('name'),email:form.get('email'),jerseyNumber:form.get('jerseyNumber'),pitcher:form.has('pitcher'),catcher:form.has('catcher')};
 draft=values;busy=true;error='';message='';page();
 try{if(editId)await editRosterPlayer(ctx.account,teamId,editId,values);else await addRosterPlayer(ctx.account,teamId,values);message=editId?'Player updated.':'Player added.';editId='';draft=null;mode='list';await reload();}
 catch(e){error=e.message||String(e);page();}
 finally{busy=false;page();}
}
async function remove(id){
 if(busy)return;const player=players.find(p=>p.id===id);if(!player)return;
 if(!confirm('Remove '+player.name+' from this team? Her history will be preserved.'))return;
 busy=true;error='';message='';page();
 try{await removeRosterPlayer(ctx.account,teamId,id);message=player.name+' removed from this team.';await reload();}
 catch(e){error=e.message||String(e);page();}
 finally{busy=false;page();}
}
async function transfer(id,selected){
 if(busy||!isOrgCoach(ctx.account))return;
 const player=players.find(p=>p.id===id);if(!player)return;
 const choices=permittedTeams().filter(t=>t.id!==teamId);
 const target=choices.find(t=>t.id===selected.trim());
 if(!target){error='Choose a destination team.';page();return;}
 if(!confirm('Transfer '+player.name+' to '+target.name+'? Her player identity and history will be preserved.'))return;
 busy=true;error='';message='';page();
 try{await transferRosterPlayer(ctx.account,teamId,target.id,id);message='Player transferred.';mode='list';editId='';await reload();}
 catch(e){error=e.message||String(e);}
 finally{busy=false;page();}
}
try{
 ctx=await accountContext();
 if(!ctx?.user||!isCoach(ctx.account)){shell('<p>Sign in as an assigned coach to manage a team roster.</p><a href="./coach.html?v=420">Coach Sign In</a>');}
 else{teamId=source;await reload();}
}catch(e){error=e.message||String(e);shell('<a href="./coach.html?v=420">Return to Coach Sign In</a>');}

document.getElementById('test-access').addEventListener('change',async e=>{testRole=e.target.value;ctx=await accountContext();teamId=testRole==='coachB'?target:source;mode='list';draft=null;editId='';error='';message='';await reload();});
document.getElementById('reset-test').addEventListener('click',()=>{if(confirm('Reset all fake players and start again?'))location.reload();});
</script></body></html>
